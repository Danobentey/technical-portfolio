name: Project checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: dotnet restore aspnetcore-student-results --locked-mode
      - run: python tests/api_integration.py

  notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install nbformat==5.10.4
      - run: python scripts/check_notebook.py
      - name: Install training environment for manual runs
        if: github.event_name == 'workflow_dispatch'
        run: python -m pip install -r tensorflow-digit-classifier/requirements.txt
      - name: Rerun the TensorFlow experiment
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/execute_notebook.py
      - name: Validate the rerun
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/check_notebook.py
